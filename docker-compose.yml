# 交付部署：复制 .env.example → .env 并修改后，执行 ./scripts/start.sh
services:
  mysql:
    image: ${MYSQL_IMAGE:-mariadb:10.6}
    container_name: insurance-bridge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insurance_bridge}
      MYSQL_USER: ${MYSQL_USER:-bridge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 数据库仅 Compose 内网访问；需宿主机调试时可自行添加 ports: ["3306:3306"]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: insurance-bridge-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 仅 Compose 内网访问；需宿主机调试时可自行添加 ports: ["6379:6379"]

  bridge:
    image: ${BRIDGE_IMAGE:-insurance-bridge:local}
    build: .
    container_name: insurance-bridge-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config/config.yaml
      TZ: Asia/Shanghai
    volumes:
      - ./logs:/app/logs
      - ./config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.26-alpine}
    container_name: insurance-bridge-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5051}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/admin-dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - bridge

volumes:
  mysql_data:
  redis_data:

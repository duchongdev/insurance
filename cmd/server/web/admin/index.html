<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>华安保险渠道对接 - 管理后台</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
    header { background: #1e40af; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { margin-top: 0; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: left; }
    input, select, button { padding: 8px 10px; margin: 4px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
    button.secondary { background: #6b7280; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: #eff6ff; padding: 16px; border-radius: 8px; text-align: center; }
    .stat b { display: block; font-size: 24px; color: #1d4ed8; }
    #loginView { max-width: 400px; margin: 80px auto; }
    .hidden { display: none; }
    .tabs button { margin-right: 8px; }
    .tabs button.active { background: #1d4ed8; }
    pre.result { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; overflow: auto; max-height: 480px; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
    label.field { display: block; margin: 8px 0 4px; font-size: 14px; }
    label.field input { width: 100%; max-width: 480px; }
  </style>
</head>
<body>
  <div id="loginView" class="card">
    <h2>管理员登录</h2>
    <div><input id="username" placeholder="用户名" autocomplete="username" /></div>
    <div><input id="password" type="password" placeholder="密码" autocomplete="current-password" /></div>
    <button onclick="login()">登录</button>
    <p style="color:#6b7280;font-size:13px;margin-top:8px">首次部署账号见 config/config.yaml 中 admin 段（仅表为空时自动创建）。</p>
    <p id="loginErr" style="color:#dc2626"></p>
  </div>

  <div id="appView" class="hidden">
    <header>
      <strong>华安保险渠道对接平台</strong>
      <button class="secondary" onclick="logout()">退出</button>
    </header>
    <main>
      <div class="card stats" id="stats"></div>
      <div class="card tabs">
        <button class="active" onclick="switchTab('channels')">渠道管理</button>
        <button onclick="switchTab('policies')">保单</button>
        <button onclick="switchTab('users')">用户</button>
        <button onclick="switchTab('signs')">签约</button>
        <button onclick="switchTab('banks')">银行列表</button>
        <button onclick="switchTab('logs')">接口日志</button>
      </div>
      <div class="card" id="panel"></div>
    </main>
  </div>

<script>
const API = '/admin/api';
let token = localStorage.getItem('admin_token') || '';
let currentTab = 'channels';

function headers() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
}

async function login() {
  const res = await fetch(API + '/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username.value, password: password.value })
  });
  const data = await res.json();
  if (!res.ok) { loginErr.textContent = data.message || '登录失败'; return; }
  token = data.token;
  localStorage.setItem('admin_token', token);
  showApp();
}

function logout() {
  token = '';
  localStorage.removeItem('admin_token');
  loginView.classList.remove('hidden');
  appView.classList.add('hidden');
}

function showApp() {
  loginView.classList.add('hidden');
  appView.classList.remove('hidden');
  loadStats();
  switchTab('channels');
}

async function loadStats() {
  const res = await fetch(API + '/stats', { headers: headers() });
  const s = await res.json();
  stats.innerHTML = `
    <div class="stat"><b>${s.policyCount||0}</b>保单</div>
    <div class="stat"><b>${s.userCount||0}</b>用户</div>
    <div class="stat"><b>${s.signCount||0}</b>签约</div>
    <div class="stat"><b>${s.apiLogCount||0}</b>接口日志</div>`;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tabs button').forEach((b,i) => {
    const tabs = ['channels','policies','users','signs','banks','logs'];
    b.classList.toggle('active', tabs[i]===tab);
  });
  if (tab==='channels') renderChannels();
  if (tab==='policies') renderList('/policies', ['policyId','channelCode','policyStatus','productCode']);
  if (tab==='users') renderList('/users', ['userId','channelCode']);
  if (tab==='signs') renderList('/signs', ['signId','policyId','channelCode']);
  if (tab==='banks') renderBankList();
  if (tab==='logs') renderList('/logs', ['traceId','channelCode','apiPath','huaanCode','durationMS']);
}

async function renderChannels() {
  panel.innerHTML = `<h2>渠道管理</h2>
    <div>
      <input id="c_code" placeholder="渠道编码" />
      <input id="c_name" placeholder="渠道名称" />
      <input id="c_huaan" placeholder="华安密钥" />
      <input id="c_key" placeholder="渠道密钥(留空自动生成)" />
      <button onclick="createChannel()">新增渠道</button>
    </div><div id="list"></div>`;
  const res = await fetch(API + '/channels?page=1&size=50', { headers: headers() });
  const data = await res.json();
  let html = '<table><tr><th>ID</th><th>编码</th><th>名称</th><th>渠道密钥</th><th>华安密钥</th><th>状态</th><th>操作</th></tr>';
  (data.list||[]).forEach(ch => {
    html += `<tr><td>${ch.id}</td><td>${ch.channelCode}</td><td>${ch.channelName||''}</td>
      <td>${ch.channelKey||'***'}</td><td>${ch.huaAnKey||'***'}</td><td>${ch.status}</td>
      <td><button class="secondary" onclick="delChannel(${ch.id})">删除</button></td></tr>`;
  });
  list.innerHTML = html + '</table>';
}

async function createChannel() {
  await fetch(API + '/channels', {
    method: 'POST', headers: headers(),
    body: JSON.stringify({
      channelCode: c_code.value,
      channelName: c_name.value,
      huaAnKey: c_huaan.value,
      channelKey: c_key.value,
      status: 1
    })
  });
  renderChannels();
  loadStats();
}

async function delChannel(id) {
  if (!confirm('确认删除?')) return;
  await fetch(API + '/channels/' + id, { method: 'DELETE', headers: headers() });
  renderChannels();
}

function renderBankList() {
  panel.innerHTML = `<h2>银行列表</h2>
    <p style="color:#6b7280;font-size:14px">手动请求华安刷新银行列表并写入 Redis；渠道 getBankList 优先读缓存。</p>
    <label class="field">渠道码
      <input id="bank_channel" value="I8p0Wn" />
    </label>
    <label class="field">华安密钥
      <input id="bank_key" value="d158da0dbddf4bec8d4f703fcd6a82cb" />
    </label>
    <div>
      <button onclick="loadBankListCache()">查看缓存</button>
      <button onclick="refreshBankList()">刷新并缓存</button>
    </div>
    <p id="bankErr" style="color:#dc2626"></p>
    <pre id="bankResult" class="result hidden"></pre>`;
  loadBankListCache();
}

async function loadBankListCache() {
  bankErr.textContent = '';
  bankResult.classList.add('hidden');
  const code = bank_channel.value.trim();
  if (!code) return;
  const res = await fetch(API + '/bank-list?channelCode=' + encodeURIComponent(code), { headers: headers() });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  if (res.status === 404) {
    bankErr.textContent = '暂无缓存，请点击「刷新并缓存」';
    return;
  }
  if (!res.ok) {
    bankErr.textContent = (data && data.message) || text || '加载失败';
    return;
  }
  bankResult.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
  bankResult.classList.remove('hidden');
}

async function refreshBankList() {
  bankErr.textContent = '';
  bankResult.classList.add('hidden');
  bankResult.textContent = '请求中...';
  bankResult.classList.remove('hidden');
  const res = await fetch(API + '/bank-list/refresh', {
    method: 'POST',
    headers: headers(),
    body: JSON.stringify({
      channelCode: bank_channel.value.trim(),
      huaAnKey: bank_key.value.trim()
    })
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  if (!res.ok) {
    bankResult.classList.add('hidden');
    bankErr.textContent = (data && data.message) || text || '请求失败';
    return;
  }
  bankResult.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
}

async function renderList(path, cols) {
  panel.innerHTML = '<h2>数据列表</h2><div id="list">加载中...</div>';
  const res = await fetch(API + path + '?page=1&size=50', { headers: headers() });
  const data = await res.json();
  let html = '<table><tr>' + cols.map(c=>`<th>${c}</th>`).join('') + '</tr>';
  (data.list||[]).forEach(row => {
    html += '<tr>' + cols.map(c=>`<td>${row[c]??''}</td>`).join('') + '</tr>';
  });
  list.innerHTML = html + '</table>';
}

if (token) showApp();
</script>
</body>
</html>

openapi: 3.0.3
info:
  title: 华安保险渠道对接服务 API
  description: |
    渠道商调用本服务，本服务验签、解密三要素后转发华安，并将华安响应原样返回（三要素字段加密）。
    管理后台 API 需 Bearer Token。
  version: 1.16.0
servers:
  - url: http://localhost
  - url: https://localhost
paths:
  /huaan/callback/insureNotify:
    post:
      tags: [华安回调]
      summary: 投保结果回调通知
      description: |
        华安调用本服务通知投保/续保结果；本服务按 channelCode 查找渠道 callbackUrl，
        追加 key/sign 后 POST 转发至下游渠道。HTTP 状态码恒为 200，业务结果见 body.code。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsureNotifyRequest'
      responses:
        '200':
          description: 处理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAckResponse'
  /health/live:
    get:
      summary: 存活探针
      responses:
        '200':
          description: ok
  /health/ready:
    get:
      summary: 就绪探针（含数据库与 Redis）
      responses:
        '200':
          description: ok
        '503':
          description: 依赖不可用
  /upChannelApi/proInsurance:
    post:
      tags: [渠道接口]
      summary: 预投保
      description: |
        姓名、证件号录入后发起预投保；本服务转发华安 POST /proxy/upChannelApi/proInsurance。
        成功返回 policyId/policyNo 后继续投保流程。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [productCode, phoneNo, name, idCard, hasSocialSecurity, isUpgrade, autoRenew]
                  properties:
                    productCode:
                      type: string
                    phoneNo:
                      type: string
                      description: 手机号（须加密）
                    name:
                      type: string
                      description: 姓名（须加密）
                    idCard:
                      type: string
                      description: 身份证号（须加密）
                    hasSocialSecurity:
                      type: integer
                      description: 1 有社保，0 无
                    isUpgrade:
                      type: integer
                      description: 1 升级，0 不升级
                    autoRenew:
                      type: integer
                      description: 1 次年自动续保，0 不自动续保
                    extra:
                      type: string
                      description: 扩展字段，可空
                    productPriceList:
                      type: array
                      description: 可选责任项；不传则使用后台默认份数
                      items:
                        type: object
                        properties:
                          liabilityName: { type: string }
                          price: { type: number }
                          kindCode: { type: string }
                          uwCount: { type: integer }
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /upChannelApi/upGradeIns:
    post:
      deprecated: true
      tags: [渠道接口]
      summary: 保单升级（已废弃）
      description: 已废弃，本服务不再注册该路由。
      responses:
        '410':
          description: 接口已废弃
  /upChannelApi/getSignUrl:
    post:
      tags: [渠道接口]
      summary: 获取签约链接
      responses:
        '200':
          description: ok
  /upChannelApi/verifyNoCode:
    post:
      deprecated: true
      tags: [渠道接口]
      summary: 用户注册（已废弃）
      description: 已废弃，本服务不再注册该路由。
      responses:
        '410':
          description: 接口已废弃
  /upChannelApi/getPolicyInfoByPhoneNo:
    post:
      deprecated: true
      tags: [渠道接口]
      summary: 查询用户保单（已废弃）
      description: 已废弃，本服务不再注册该路由。
      responses:
        '410':
          description: 接口已废弃
  /upChannelApi/getProductPricesByProductCode:
    post:
      tags: [渠道接口]
      summary: 查询产品价格
      responses:
        '200':
          description: ok
  /upChannelApi/getBankList:
    post:
      tags: [渠道接口]
      summary: 获取支持的银行列表
      description: |
        本服务转发华安 POST /common/channel/api/getBankList。
        优先 Redis 缓存，其次 bank_info_t，最后请求华安。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedRequest'
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BankListItem'
  /upChannelApi/getProductInfoByChannel:
    post:
      deprecated: true
      tags: [渠道接口]
      summary: 渠道查询产品（已废弃）
      description: |
        **已废弃**：华安侧不再使用该接口，请改用 `/upChannelApi/product/info` 获取 productCode。
        本服务不再注册该路由。
      responses:
        '410':
          description: 接口已废弃
  /upChannelApi/product/info:
    post:
      tags: [渠道接口]
      summary: 获取渠道产品信息
      description: 按手机号查询渠道产品详情；转发华安 /common/channel/api/product/info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [phoneNo]
                  properties:
                    phoneNo:
                      type: string
                      description: 手机号（三要素，须加密）
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /upChannelApi/sms/send:
    post:
      tags: [渠道接口]
      summary: 获取用户短信验证码
      description: 向手机号发送验证码；转发华安 /common/channel/api/sms/send
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [phoneNo]
                  properties:
                    phoneNo:
                      type: string
                      description: 手机号（三要素，须加密）
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /upChannelApi/sms/valid:
    post:
      tags: [渠道接口]
      summary: 短信验证码校验
      description: |
        校验手机号与短信验证码；转发华安 `POST /common/channel/api/sms/valid`。
        请求体字段为 `phoneNo`（手机号，须加密/明文与渠道 `piiEncrypted` 一致）与 `code`（验证码明文）。
        本服务转发华安时按上游规则计算请求头 `sign`（参与字段：`channelCode`、`phoneNo`、`code`、`timestamp`，末尾标准 `&key=华安密钥`，MD5 大写）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [phoneNo, code]
                  properties:
                    phoneNo:
                      type: string
                      description: 手机号（须加密，对应华安 phoneNo 字段）
                    code:
                      type: string
                      description: 短信验证码（明文，对应华安 code 字段）
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /upChannelApi/sms/noValid:
    post:
      tags: [渠道接口]
      summary: 免短信验证码注册登录
      description: 仅凭手机号注册/登录；转发华安 /common/channel/api/sms/noValid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [mobile]
                  properties:
                    mobile:
                      type: string
                      description: 手机号（须加密，对应华安 mobile 字段）
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /upChannelApi/priceByUser:
    post:
      tags: [渠道接口]
      summary: 查询产品价格
      description: 按用户与产品编码查价；转发华安 /common/channel/api/priceByUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [productCode, idCard, hasSocialSecurity]
                  properties:
                    productCode:
                      type: string
                      description: 产品编码
                    idCard:
                      type: string
                      description: 身份证号（须加密）
                    hasSocialSecurity:
                      type: integer
                      description: 是否有社保，1 有 0 无
                    productPriceList:
                      type: array
                      description: 可选，责任项与份数；不传则使用后台默认配置
                      items:
                        type: object
                        properties:
                          liabilityName: { type: string }
                          price: { type: number }
                          kindCode: { type: string }
                          uwCount: { type: integer }
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /upChannelApi/policy/phone:
    post:
      tags: [渠道接口]
      summary: 通过手机号查询用户投保情况
      description: |
        用户二次进入页面时查询已购基础版产品；转发华安 /common/channel/api/policy/phone。
        `phoneNo` 与 `userId` 至少传一项。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  properties:
                    phoneNo:
                      type: string
                      description: 手机号（须加密；与 userId 二选一）
                    userId:
                      type: string
                      description: 用户 ID（与 phoneNo 二选一）
      responses:
        '200':
          description: 华安标准响应，data 为基础版产品数组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /upChannelApi/getUserInfoByPhoneNo:
    post:
      tags: [渠道接口]
      summary: 根据手机号或用户 ID 查询用户信息
      description: |
        转发华安 POST /common/channel/api/getUserInfoByPhoneNo。
        `phoneNo` 与 `userId` 至少传一项；响应 data 含三要素须加密返回渠道。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  properties:
                    phoneNo:
                      type: string
                      description: 手机号（须加密；与 userId 二选一）
                    userId:
                      type: string
                      description: 用户 ID（与 phoneNo 二选一）
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfoData'
  /upChannelApi/getPhoneByToken:
    post:
      tags: [渠道接口]
      summary: 一键登录解密手机号
      description: |
        一键登录后凭 token 与 userInformation 解密获取用户手机号；
        转发华安 POST /common/channel/api/getPhoneByToken。
        响应 `data` 为手机号字符串，返回渠道时须加密。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [userInformation, token]
                  properties:
                    userInformation:
                      type: string
                      description: 一键登录返回的用户信息
                    token:
                      type: string
                      description: 一键登录返回的 token
      responses:
        '200':
          description: 华安标准响应，data 为用户手机号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: string
                        description: 用户手机号（返回渠道时须加密）
  /upChannelApi/getLiabilitiesByProductId:
    post:
      tags: [渠道接口]
      summary: 根据产品查询可选责任列表
      description: 获取可选责任列表，配合 priceByUser 使用；转发华安 /common/channel/api/getLiabilitiesByProductId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [productCode, idCard, hasSocialSecurity, productType]
                  properties:
                    productCode:
                      type: string
                      description: 产品编码
                    idCard:
                      type: string
                      description: 身份证号（须加密）
                    hasSocialSecurity:
                      type: integer
                      description: 是否有社保，1 有 0 无
                    productType:
                      type: integer
                      description: 1 体验版，2 正式版
      responses:
        '200':
          description: 华安标准响应，data 为责任项数组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /upChannelApi/getProductPricesByPolicyId:
    post:
      tags: [渠道接口]
      summary: 按保单 ID 查价格（收银台）
      description: |
        收银台展示支付金额；本服务转发华安 POST /common/channel/api/getProductPricesByPolicyId。
        仅需 policyId，无需三要素。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [policyId]
                  properties:
                    policyId:
                      type: string
                      description: 保单 ID（通常来自 proInsurance）
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PolicyPriceData'
  /upChannelApi/getPolicyInfoByPolicyId:
    post:
      tags: [渠道接口]
      summary: 根据保单 ID 查询保单信息
      description: |
        本服务转发华安 POST /common/channel/api/getPolicyInfoByPolicyId。
        仅需 policyId；响应中 phoneNo/name/idCard 及 insuredList 内三要素须加密返回渠道。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignedRequest'
                - type: object
                  required: [policyId]
                  properties:
                    policyId:
                      type: string
                      description: 保单 ID（通常来自 proInsurance）
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PolicyInfoData'
  /admin/api/login:
    post:
      tags: [管理后台]
      summary: 管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: token
  /admin/api/channels:
    get:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 渠道列表
    post:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 创建渠道（渠道编码来自华安配置）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
  /admin/api/channels/{id}:
    put:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 更新渠道
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdateInput'
      responses:
        '200':
          description: 更新后的渠道
  /admin/api/banks:
    get:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 分页查询银行信息（bank_info_t）
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema: { type: integer, description: '1=启用 2=停用，0 或不传表示全部' }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankInfo'
                  total: { type: integer }
  /admin/api/bank-list:
    get:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 读取 Redis 中已缓存的银行列表
      parameters:
        - in: query
          name: channelCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 华安 getBankList 原始响应（来自 Redis）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: 该渠道尚无缓存
  /admin/api/bank-list/refresh:
    post:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 手动请求华安刷新银行列表，全量覆盖 bank_info_t 并写入 Redis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [huaanSettingId]
              properties:
                huaanSettingId:
                  type: integer
                  description: 所选华安配置 ID，用于请求 getBankList
      responses:
        '200':
          description: 华安 getBankList 原始响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '502':
          description: 华安不可达或超时
  /admin/api/huaan-configs:
    get:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 列出全部华安上游配置
      responses:
        '200':
          description: 配置列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/HuaAnConfig'
    post:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 新建华安上游配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HuaAnConfigInput'
      responses:
        '200':
          description: 新建的配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuaAnConfig'
  /admin/api/huaan-configs/{id}:
    put:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 更新华安上游配置
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HuaAnConfigInput'
      responses:
        '200':
          description: 更新后的配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuaAnConfig'
    delete:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 删除华安上游配置
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 已删除
  /admin/api/huaan-configs/{id}/test:
    post:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 探测指定配置的接口根地址网络连通性（HTTP HEAD/GET）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 连通性探测结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuaAnConnectivityResult'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SignedRequest:
      type: object
      required: [timestamp, channelCode, sign, key]
      properties:
        timestamp: { type: string }
        channelCode: { type: string }
        key: { type: string, description: 本服务分配的渠道密钥 }
        sign: { type: string }
        phoneNo: { type: string, description: AES-GCM Base64 密文 }
        name: { type: string, description: AES-GCM Base64 密文 }
        idCard: { type: string, description: AES-GCM Base64 密文 }
    ApiResponse:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string }
        data: { type: object }
    BankInfo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        bankCode: { type: string }
        bankName: { type: string }
        debitCard: { type: integer, description: '1=支持储蓄卡 0=不支持' }
        creditCard: { type: integer, description: '1=支持信用卡 0=不支持' }
        payChannelId: { type: string, description: 支付渠道 ID（getBankList 同步） }
        isActBank: { type: integer, description: '1=活跃银行 0=非活跃' }
        status: { type: integer, description: '1=启用 2=停用' }
        createTime: { type: string, format: date-time }
        updateTime: { type: string, format: date-time }
    BankListItem:
      type: object
      properties:
        bankName: { type: string, example: 中国工商银行 }
        bankCode: { type: string, example: ICBC }
        debitCard: { type: string, description: '"1" 支持储蓄卡，"0" 不支持', example: '1' }
        creditCard: { type: string, description: '"1" 支持信用卡，"0" 不支持', example: '1' }
        payChannelId: { type: string }
        isActBank: { type: integer, description: '1=活跃银行 0=非活跃', example: 1 }
    PolicyPriceHistoryBind:
      type: object
      properties:
        bankName: { type: string }
        bankCode: { type: string }
        isPaySuccess:
          type: integer
          description: '1=支付成功 0=支付失败；缺省表示回调未到'
    PolicyPriceData:
      type: object
      properties:
        productCode: { type: string }
        productName: { type: string }
        price: { type: number, format: double }
        historyBinds:
          type: array
          description: 历史绑卡/支付记录（逐步启用）
          items:
            $ref: '#/components/schemas/PolicyPriceHistoryBind'
    PolicyInsuredItem:
      type: object
      properties:
        insuredCardNo: { type: string, description: 被保人证件号（响应须加密） }
        insuredName: { type: string, description: 被保人姓名（响应须加密） }
        phoneNo: { type: string, description: 被保人手机号（响应须加密） }
        hasSocialSecurity: { type: string }
    PolicyRiskItem:
      type: object
      properties:
        riskName: { type: string }
        riskCode: { type: string, nullable: true }
    PolicyInfoData:
      type: object
      properties:
        policyId: { type: string }
        policyStatus: { type: string }
        productCode: { type: string }
        productName: { type: string }
        productId: { type: string }
        payPremium: { type: number, format: double }
        hasSocialSecurity: { type: string }
        policyStartDate: { type: string, nullable: true }
        policyEndDate: { type: string, nullable: true }
        createTime: { type: string }
        phoneNo: { type: string, description: 投保人手机号（响应须加密） }
        name: { type: string, description: 投保人姓名（响应须加密） }
        idCard: { type: string, description: 投保人证件号（响应须加密） }
        autoRenew: { type: integer, nullable: true }
        insuredList:
          type: array
          items:
            $ref: '#/components/schemas/PolicyInsuredItem'
        riskList:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRiskItem'
        optionalRiskList:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRiskItem'
    UserInfoData:
      type: object
      properties:
        userId: { type: string }
        idCard: { type: string, description: 证件号（响应须加密） }
        name: { type: string, description: 姓名（响应须加密） }
        phoneNo: { type: string, description: 手机号（响应须加密） }
        channelCode: { type: string }
    HuaAnConfig:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: 配置名称（可选） }
        envType:
          type: string
          enum: [prod, test]
          description: 环境类型，prod=生产 test=测试
        baseUrl:
          type: string
          description: 华安上游接口根地址
        channelCode:
          type: string
          description: 华安侧渠道编码
        channelSecret:
          type: string
          description: 华安侧密钥（请求体 key 字段）
        isActive:
          type: boolean
          description: 历史字段，已不再用于切换当前配置
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HuaAnConfigInput:
      type: object
      required: [envType, baseUrl, channelCode]
      properties:
        name: { type: string }
        envType:
          type: string
          enum: [prod, test]
        baseUrl:
          type: string
          description: 华安上游接口根地址
        channelCode:
          type: string
          description: 华安侧渠道编码
        channelSecret:
          type: string
          description: 新建时必填；更新时留空则保留原值
    HuaAnConnectivityResult:
      type: object
      properties:
        ok:
          type: boolean
          description: 是否成功收到上游 HTTP 响应
        durationMs:
          type: integer
          format: int64
          description: 请求耗时（毫秒）
        upstreamUrl:
          type: string
          description: 实际探测的 URL（接口根地址）
        httpStatus:
          type: integer
          description: 上游返回的 HTTP 状态码
        message:
          type: string
          description: 可读结果说明
    ChannelInput:
      type: object
      required: [huaanSettingId, callbackUrl]
      properties:
        huaanSettingId:
          type: integer
          description: 关联的华安配置 ID，渠道编码与华安密钥由此同步
        channelName: { type: string }
        channelKey: { type: string, description: 留空则服务端自动生成 }
        callbackUrl:
          type: string
          description: 投保结果回调地址，须 http(s) URL
        status: { type: integer, description: '1=启用 0=禁用', default: 1 }
    ChannelUpdateInput:
      type: object
      properties:
        channelName: { type: string }
        channelKey: { type: string, description: 留空则保留原值 }
        callbackUrl:
          type: string
          description: 投保结果回调地址
        status: { type: integer, description: '1=启用 0=禁用' }
    InsureNotifyRequest:
      type: object
      required:
        - productName
        - productType
        - insureTime
        - policyNo
        - policyId
        - amount
        - policyStartDate
        - policyEndDate
        - payStage
        - channelCode
        - timestamp
      properties:
        productName: { type: string }
        productType: { type: integer, description: '1 基础版 2 升级版' }
        insureTime: { type: string, description: 'yyyy-MM-dd HH:mm:ss' }
        policyNo: { type: string }
        policyId: { type: string }
        amount: { type: number, format: double }
        policyStartDate: { type: string }
        policyEndDate: { type: string }
        payStage: { type: integer }
        channelCode: { type: string }
        timestamp: { type: integer, format: int64 }
        extra: { type: string, description: 预投保 extra 原样回传 }
    CallbackAckResponse:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: 成功 }

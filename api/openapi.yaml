openapi: 3.0.3
info:
  title: 华安保险渠道对接服务 API
  description: |
    渠道商调用本服务，本服务验签、解密三要素后转发华安，并将华安响应原样返回（三要素字段加密）。
    管理后台 API 需 Bearer Token。
  version: 1.0.0
servers:
  - url: http://localhost:5051
paths:
  /health/live:
    get:
      summary: 存活探针
      responses:
        '200':
          description: ok
  /health/ready:
    get:
      summary: 就绪探针（含数据库与 Redis）
      responses:
        '200':
          description: ok
        '503':
          description: 依赖不可用
  /upChannelApi/proInsurance:
    post:
      tags: [渠道接口]
      summary: ZF-预投保
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedRequest'
      responses:
        '200':
          description: 华安标准响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /upChannelApi/upGradeIns:
    post:
      tags: [渠道接口]
      summary: 保单升级
      responses:
        '200':
          description: ok
  /upChannelApi/getSignUrl:
    post:
      tags: [渠道接口]
      summary: 获取签约链接
      responses:
        '200':
          description: ok
  /upChannelApi/verifyNoCode:
    post:
      tags: [渠道接口]
      summary: 用户注册
      responses:
        '200':
          description: ok
  /upChannelApi/getPolicyInfoByPhoneNo:
    post:
      tags: [渠道接口]
      summary: 查询用户保单
      responses:
        '200':
          description: ok
  /upChannelApi/getProductPricesByProductCode:
    post:
      tags: [渠道接口]
      summary: 查询产品价格
      responses:
        '200':
          description: ok
  /upChannelApi/getBankList:
    post:
      tags: [渠道接口]
      summary: 获取银行列表（优先 Redis 缓存，其次 bank_info_t，最后请求华安）
      responses:
        '200':
          description: ok
  /upChannelApi/getProductInfoByChannel:
    post:
      tags: [渠道接口]
      summary: 渠道查询产品
      responses:
        '200':
          description: ok
  /upChannelApi/getProductPricesByPolicyId:
    post:
      tags: [渠道接口]
      summary: 保单ID查价格
      responses:
        '200':
          description: ok
  /upChannelApi/getPolicyInfoByPolicyId:
    post:
      tags: [渠道接口]
      summary: 保单ID查信息
      responses:
        '200':
          description: ok
  /admin/api/login:
    post:
      tags: [管理后台]
      summary: 管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: token
  /admin/api/channels:
    get:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 渠道列表
    post:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 创建渠道
  /admin/api/stats:
    get:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 统计概览
  /admin/api/banks:
    get:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 分页查询银行信息（bank_info_t）
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema: { type: integer, description: '1=启用 2=停用，0 或不传表示全部' }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankInfo'
                  total: { type: integer }
  /admin/api/bank-list:
    get:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 读取 Redis 中已缓存的银行列表
      parameters:
        - in: query
          name: channelCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 华安 getBankList 原始响应（来自 Redis）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: 该渠道尚无缓存
  /admin/api/bank-list/refresh:
    post:
      tags: [管理后台]
      security: [{ bearerAuth: [] }]
      summary: 手动请求华安刷新银行列表，全量覆盖 bank_info_t 并写入 Redis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelCode, huaAnKey]
              properties:
                channelCode: { type: string, description: 渠道编码 }
                huaAnKey: { type: string, description: 华安签名密钥 }
      responses:
        '200':
          description: 华安 getBankList 原始响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '502':
          description: 华安不可达或超时
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SignedRequest:
      type: object
      required: [timestamp, channelCode, sign, key]
      properties:
        timestamp: { type: string }
        channelCode: { type: string }
        key: { type: string, description: 本服务分配的渠道密钥 }
        sign: { type: string }
        phoneNo: { type: string, description: AES-GCM Base64 密文 }
        name: { type: string, description: AES-GCM Base64 密文 }
        idCard: { type: string, description: AES-GCM Base64 密文 }
    ApiResponse:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string }
        data: { type: object }
    BankInfo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        bankCode: { type: string }
        bankName: { type: string }
        debitCard: { type: integer, description: '1=支持储蓄卡 0=不支持' }
        creditCard: { type: integer, description: '1=支持信用卡 0=不支持' }
        status: { type: integer, description: '1=启用 2=停用' }
        createTime: { type: string, format: date-time }
        updateTime: { type: string, format: date-time }

server:
  port: 8080
  mode: release
  read_timeout: 15s
  write_timeout: 30s
  upstream_timeout: 25s

huaan:
  base_url: https://xx.xxx.api.york.xin
  api_path: /upChannelApi

database:
  dsn: bridge:bridge123@tcp(localhost:3306)/insurance_bridge?charset=utf8mb4&parseTime=True&loc=Local

security:
  # 32字节密钥，用于渠道三要素加解密及库内敏感字段存储（生产环境务必更换）
  data_encryption_key: "0123456789abcdef0123456789abcdef"
  jwt_secret: "change-me-in-production-jwt-secret-key"

log:
  level: info
  file_path: ./logs/app.log
  retention_days: 90
  archive_enabled: true

admin:
  default_username: admin
  default_password: admin123
